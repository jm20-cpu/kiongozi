{% extends "base.html" %}{% block title %}Counties{% endblock %}{% block content %}<section class="page"><small>KENYA</small><h1>47 Counties</h1><p>Explore leadership data by county.</p></section><section class="countygrid">{% for x in counties %}<a class="card" href="/leaders?county={{x.name}}"><small>{{"%02d"|format(loop.index)}}</small><h3>{{x.name}}</h3><p>{{x.leaders}} leaders</p><span>{{x.evaluated}} evaluated</span></a>{% endfor %}</section>{% endblock %}
